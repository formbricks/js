name: Release JS SDK

# Publishing a GitHub release publishes the SDK. The version comes from the tag;
# see RELEASING.md. This workflow only builds, publishes and verifies: CI already
# ran on main, and the manual QA run in RELEASING.md covers the rest.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: "@formbricks/js"
  PACKAGE_DIR: packages/js

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false # no caches in a publishing workflow

      - name: Resolve the version and dist-tag from the tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/release/resolve-release.mjs >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write the version into the package manifest
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm pkg set "version=$VERSION"

      - name: Build
        run: pnpm exec turbo run build --filter="$PACKAGE_NAME"

      # A fixed file name keeps the publish step free of globs.
      - name: Pack
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          mv "$RUNNER_TEMP"/pack/*.tgz "$RUNNER_TEMP/package.tgz"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false # no caches in a publishing workflow
          registry-url: "https://registry.npmjs.org"

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Check whether the version is already on npm
        id: registry
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/release/npm-registry.mjs exists "$PACKAGE_NAME" "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.registry.outputs.exists == 'false'
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish "$RUNNER_TEMP/package/package.tgz" --tag "$DIST_TAG" --access public

      - name: Skip a version that is already published
        if: steps.registry.outputs.exists == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: echo "::notice::$PACKAGE_NAME@$VERSION is already on npm, skipping publish."

  verify:
    name: Verify on npm
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false # no caches in a publishing workflow

      - name: Wait for the version on its dist-tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: >-
          node scripts/release/npm-registry.mjs verify
          "$PACKAGE_NAME" "$VERSION" "$DIST_TAG"
          --timeout-seconds 600 --interval-seconds 15
